name: Deploy to GitHub Pages

on:
  # Deploy on every push to main.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages via the artifact flow.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment at a time; let a newer push supersede an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The private assets repo exposes its content under /assets. The ksaAssets
      # Vite plugin reads KSA_ASSETS_DIR and copies that tree into dist/ksa/.
      KSA_ASSETS_DIR: ${{ github.workspace }}/.tmp/flexo-private-assets/assets
      VITE_BUILD_ID: ${{ github.sha }}
    steps:
      - name: Checkout flexo
        uses: actions/checkout@v6

      # The licensed KSA binaries live in a separate private repo (kept out of
      # this open-source repo). Needs an SSH deploy key — add the matching public
      # key as a read-only Deploy Key on meow-sci/flexo-private-assets, and store
      # the private key as the FLEXO_PRIVATE_ASSETS_SSH_KEY repo secret.
      - name: Checkout private KSA assets
        uses: actions/checkout@v6
        with:
          repository: meow-sci/flexo-private-assets
          path: .tmp/flexo-private-assets
          token: ${{ secrets.FLEXO_PRIVATE_ASSETS_PAT }}
          persist-credentials: false
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # base is '/flexo/' (vite.config.ts); served at meow.science.fail/flexo/.
      - name: Build
        run: pnpm run build

      # Part thumbnails are rendered OUT of the freshly built dist/ by headless
      # Chromium and written back into it (plus the manifest's `thumbs` field), so
      # these two steps must sit between Build and Upload: dist/ only exists in CI,
      # and a rebuild of the mini app would wipe them. See
      # plans/PART_PREVIEW_THUMBS.md §7.
      # Not gated on the thumbnail cache hit below: if an earlier run failed partway,
      # its cache entry is a PARTIAL set under the same key, and the capture then has
      # real work to do on the very run that would have skipped this install.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # img2webp muxes the captured frames into one animated WebP per part. The
      # capture step checks for it before rendering the catalog.
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      # Render defaults only, on purpose: thumbnail size (DEFAULT_THUMB_SIZE), turntable
      # length (THUMB_COUNT), the angle-0 camera direction (DEFAULT_VIEW_DIR) and
      # the part's own orientation (DEFAULT_PART_ROTATION_DEG) all live in
      # apps/partpreview/src/thumbsSpec.ts, so the build has one knob each. Capture
      # and img2webp are explicitly given this runner's four vCPUs below. Pass
      # --width/--height/--view-dir/--rotate here only to override the build.
      #
      # This step is SLOW here and that is expected: the runner has no GPU, so all
      # ~165 parts x 18 angles are drawn by SwiftShader on four vCPUs — roughly 24
      # CPU-seconds per part, i.e. ~20 minutes wall clock fully saturated. The
      # per-part budget (--part-timeout, 300 s by default) is sized for that; raise
      # it rather than lowering the quality if the heaviest parts start timing out.
      # The capture is worth ~25 minutes of runner time, and most pushes here change
      # the main editor without touching a single rendered pixel. So key a cache on
      # the BUILT INPUTS the capture actually reads — the mini app's own bundle (which
      # is byte-identical across commits unless its render path changed; the build id
      # is injected into the main app only), the KSA asset tree, the KTX2/Draco
      # decoders and the HDRs it fetches from the main app's copy — plus the capture
      # script, this workflow (it owns the render flags) and the lockfile (it pins
      # Playwright's Chromium). Deliberately NOT keyed on `src/`: an editor-only
      # commit leaves every one of these bytes identical and reuses the render.
      - name: Compute thumbnail cache key
        id: thumbs-key
        run: |
          set -euo pipefail
          hash=$(
            {
              LC_ALL=C find dist/apps/partpreview dist/ksa dist/basis dist/draco dist/hdr \
                -type f ! -name manifest.json \
                -not -path 'dist/apps/partpreview/assets/thumbs/*' \
                -not -path 'dist/apps/partpreview/assets/turntables/*' \
                -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
              sha256sum scripts/capture-part-thumbs.ts .github/workflows/deploy.yml pnpm-lock.yaml
            } | sha256sum | cut -d' ' -f1
          )
          echo "key=thumbs-v1-$hash" >> "$GITHUB_OUTPUT"
          echo "part thumbnail cache key: thumbs-v1-$hash"

      # Restored INTO the freshly built dist/, so it has to sit after Build (which
      # empties dist/apps/partpreview) and before the capture. A restored set is
      # complete and current by construction — the key covers everything that decides
      # a pixel — so the capture below skips it wholesale and never boots Chromium.
      - name: Restore rendered part thumbnails
        id: thumbs-cache
        uses: actions/cache@v4
        with:
          path: |
            dist/apps/partpreview/assets/thumbs
            dist/apps/partpreview/assets/turntables
          # No restore-keys, ON PURPOSE: a near-miss must never seed --skip-existing
          # with pixels rendered from different code or different KSA assets. A miss
          # re-renders the whole catalog into an empty dist/, so stale files from a
          # renamed or deleted part cannot accumulate either.
          key: ${{ steps.thumbs-key.outputs.key }}

      # Runs on a cache hit too: it is what patches manifest.json with the thumb and
      # turntable URLs, and on a full hit that costs a second (no browser, no img2webp).
      - name: Capture part thumbnails
        run: pnpm run thumbs:partpreview --jobs 4 --skip-existing

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
